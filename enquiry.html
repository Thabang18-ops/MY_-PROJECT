<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiry | VitaPura Home & Office Care</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            <h1>VitaPura</h1>
        </div>

        <nav>
            <ul>
                <li>
                    <a href="index.html">HOME</a>
                </li>

                <li>
                    <a href="about _us.html">ABOUT US</a>
                </li>

                <li>
                    <a href="services.html">SERVICES</a>
                </li>

                <li>
                    <a href="product.html">PRODUCTS</a>
                </li>

                <li>
                    <a href="enquiry.html">ENQUIRY</a>
                </li>

                <li>
                    <a href="contact.html">CONTACT</a>
                </li>
            </ul>
        </nav>

    </header>


    <main>

        <section id="enquiry-hero">

            <div class="enquiry-content">

                <h2>Request a Quote</h2>

                <p>
                    Tell us what cleaning service you need
                    and we will get back to you.
                </p>

            </div>

        </section>


        <section id="enquiry-form-section">

            <h2>Cleaning Service Enquiry</h2>

            <form id="enquiryForm">

                <div class="form-group">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="service">Select a Service</label>

                    <select id="service" name="service" required>

                        <option value="">-- Select a service --</option>

                        <option value="home-cleaning">
                            Home Cleaning
                        </option>

                        <option value="office-cleaning">
                            Office Cleaning
                        </option>

                        <option value="deep-cleaning">
                            Deep Cleaning
                        </option>

                        <option value="regular-cleaning">
                            Regular Cleaning
                        </option>

                        <option value="move-in-out">
    Move-In/Move-Out Cleaning
</option>

<option value="window-cleaning">
    Window Cleaning
</option>

<option value="carpet-upholstery">
    Carpet & Upholstery Cleaning
</option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="date">Preferred Date</label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="message">Additional Information</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Tell us anything else we should know..."
                    ></textarea>

                </div>


               <div class="quote-section">

                  <button type="button" id="quoteButton">
                         Get VitaQuote
                  </button>

                    <p id="quoteResult"></p>

                </div>

                <button type="submit">
                   Submit Enquiry
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>VitaPura Home & Office Care</p>

        <p>&copy; 2026 VitaPura. All rights reserved.</p>

    </footer>

<script src="script.js"></script>    

</body>

</html>
